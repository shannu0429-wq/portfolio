services:
  - type: web
    name: shanmukha-portfolio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: shanmukha_admin
      - key: ADMIN_PASSWORD
        sync: false
